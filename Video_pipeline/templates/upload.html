<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Video Analyzer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4 py-8">

  <div class="bg-white w-full max-w-xl rounded-xl shadow-2xl p-8">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Upload MP4 File</h2>

    <form id="uploadForm" action="/process_video/" method="post" enctype="multipart/form-data" class="space-y-4">
      <div
        id="drop-area"
        class="border-2 border-dashed border-indigo-300 rounded-lg p-6 text-center cursor-pointer bg-indigo-50 hover:bg-indigo-100 transition"
      >
        <input id="fileInput" type="file" name="video_file" accept="video/mp4" class="hidden" required />
        <p class="text-gray-700"><strong>Drag & drop</strong> your .mp4 file here or <span class="text-indigo-600 underline">browse</span></p>
        <p id="file-name" class="mt-2 text-sm text-indigo-600"></p>
      </div>

      <div id="error" class="text-red-500 text-sm hidden"></div>

      <button
        type="submit"
        class="w-full py-2 px-4 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition"
      >
        Analyze
      </button>
    </form>

    {% if result %}
    <div class="mt-6 p-4 rounded-md {% if 'Error' in result.message %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-800{% endif %}">
      <h3 class="text-lg font-bold mb-2">Result</h3>
      <p><strong>Message:</strong> {{ result.message }}</p>
      {% if result.video_file %}
        <p><strong>Uploaded File:</strong> {{ result.video_file }}</p>
      {% endif %}
      {% if result.predicted_class %}
        <p><strong>Predicted Class:</strong> {{ result.predicted_class }}</p>
      {% endif %}
    </div>
    {% endif %}

  </div>

  <script>
    const dropArea = document.getElementById('drop-area');
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('file-name');
    const errorDisplay = document.getElementById('error');
    const MAX_SIZE = 50 * 1024 * 1024; // 50MB

    dropArea.addEventListener('click', () => fileInput.click());

    dropArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropArea.classList.add('bg-indigo-100');
    });

    dropArea.addEventListener('dragleave', () => {
      dropArea.classList.remove('bg-indigo-100');
    });

    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      dropArea.classList.remove('bg-indigo-100');
      if (e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        if (file.size > MAX_SIZE) {
          errorDisplay.textContent = "File exceeds 50MB limit.";
          errorDisplay.classList.remove('hidden');
          fileInput.value = ""; // Clear invalid file
          fileNameDisplay.textContent = "";
        } else {
          errorDisplay.classList.add('hidden');
          fileInput.files = e.dataTransfer.files;
          fileNameDisplay.textContent = file.name;
        }
      }
    });

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file && file.size > MAX_SIZE) {
        errorDisplay.textContent = "File exceeds 50MB limit.";
        errorDisplay.classList.remove('hidden');
        fileInput.value = ""; // Clear file
        fileNameDisplay.textContent = "";
      } else if (file) {
        errorDisplay.classList.add('hidden');
        fileNameDisplay.textContent = file.name;
      }
    });
  </script>
</body>
</html>
